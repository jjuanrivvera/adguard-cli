# CI — delegates to the fleet-canonical reusable workflow in jjuanrivvera/.github.
# Change fleet-wide CI policy there, not here. Repo-specific inputs only live below.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: jjuanrivvera/.github/.github/workflows/go-ci.yml@main
    with:
      coverage-threshold: ""          # no scripts/cover-check.sh gate in this repo yet
      run-gosec: false                # never run historically; enable in a follow-up once clean
      run-docs-check: false           # no generated command docs / docs-gen target
      os-matrix: '["ubuntu-latest"]'  # run-build now on (default): .goreleaser.yml modernized to homebrew_casks
