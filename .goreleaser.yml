version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: adguard-home
    main: ./cmd/adguard-home
    binary: adguard-home
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"

# homebrew_casks (not the deprecated `brews`): casks are the modern GoReleaser path for a
# pre-built binary and match the rest of the fleet. NOTE: this switches the tap artifact from a
# Formula to a Cask — delete the stale Formula/adguard-cli.rb from homebrew-adguard-cli after the
# first cask release, or brew sees a formula+cask name collision.
homebrew_casks:
  - name: adguard-cli
    binaries: [adguard-home]
    repository:
      owner: jjuanrivvera
      name: homebrew-adguard-cli
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/jjuanrivvera/adguard-cli"
    description: "The missing command-line interface for AdGuard Home"
    # Strip the macOS quarantine xattr so the unsigned CLI binary runs without a Gatekeeper prompt.
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/adguard-home"]

scoops:
  # The bucket repo (scoop-adguard-cli) must already exist; GoReleaser pushes to it
  # with the cross-repo token but won't create it.
  - repository:
      owner: jjuanrivvera
      name: scoop-adguard-cli
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/jjuanrivvera/adguard-cli"
    description: "The missing command-line interface for AdGuard Home"
    license: MIT

release:
  github:
    owner: jjuanrivvera
    name: adguard-cli
  prerelease: auto
  name_template: "v{{.Version}}"
